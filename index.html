<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVINET JC - Cotizador de Cámaras</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="ticket">
      
      <!-- ENCABEZADO CENTRADO -->
      <div class="ticket-header">
        <div class="logo-title-block">
          <img src="servinet.jpg" alt="Logo SERVINET JC" class="header-logo">
          <div class="title-text">
            <h3>SERVINET JC</h3>
            <p>Conectándote al Futuro!!</p>
            <small>Venta e Instalación de Sistemas de Seguridad</small>
          </div>
        </div>
        
        <!-- NÚMERO DE COTIZACIÓN A LA DERECHA -->
        <div class="folio-row">
          <label>Cotización Nº</label>
          <input type="text" id="folio" value="COT-001" class="text-center">
        </div>
      </div>

      <div class="ticket-body">
        <!-- DATOS DEL CLIENTE CENTRADOS -->
        <div class="row">
          <label>Fecha:</label>
          <input type="date" id="fecha" class="text-center">
        </div>

        <div class="row">
          <label>Cliente:</label>
          <input type="text" id="nombre" placeholder="Nombre completo del cliente" class="text-center">
        </div>

        <div class="row">
          <label>Teléfono:</label>
          <input type="text" id="telefono" placeholder="Número de teléfono" class="text-center">
        </div>

        <div class="row">
          <label>Dirección:</label>
          <input type="text" id="direccion" placeholder="Escriba la dirección o ubicación del cliente" class="text-center">
        </div>

        <hr>

        <h4 class="section-title">EQUIPOS Y SERVICIOS INCLUIDOS EN EL PAQUETE</h4>

        <!-- CÁMARAS HD -->
        <div class="item-row">
          <div class="item-info">
            <label>Cámaras de Seguridad HD:</label>
            <small class="precio-interno">Precio U: Q 225.00</small>
          </div>
          <div class="item-qty">
            <label>Cant:</label>
            <input type="number" id="cantCamaras" min="0" value="2" class="calc-trigger text-center">
          </div>
        </div>

        <!-- DVR -->
        <div class="item-row">
          <div class="item-info">
            <label>Grabador Digital DVR / XVR</label>
          </div>
          <select id="selectDvr" class="calc-trigger flex-select">
            <option value="0">Sin DVR</option>
            <option value="450" selected>DVR 4 Canales</option>
            <option value="750">DVR 8 Canales</option>
            <option value="1200">DVR 16 Canales</option>
          </select>
        </div>

        <!-- DISCO DURO -->
        <div class="item-row">
          <div class="item-info">
            <label>Disco Duro / Servicio de Almacenamiento</label>
          </div>
          <select id="selectHdd" class="calc-trigger flex-select">
            <option value="0">Sin Disco Duro / Servicio</option>
            <option value="125">Montaje e Instalación de Disco Duro</option>
            <option value="350" selected>Disco Duro 1 TB (Mantenimiento / Instalación)</option>
            <option value="550">Disco Duro 2 TB (Mantenimiento / Instalación)</option>
          </select>
        </div>

        <!-- KITS Y CAJAS -->
        <div class="item-row">
          <div class="item-info">
            <label>Kits de Conexión, Fuentes y Cajas de Registro</label>
            <small>Baluns, fuentes de poder y cajas térmicas</small>
          </div>
          <input type="checkbox" id="chkAccesorios" class="calc-trigger check-lg" checked>
        </div>

        <!-- CANALIZACIÓN -->
        <div class="item-row">
          <div class="item-info">
            <label>Canalización de Cableado</label>
          </div>
          <select id="selectCanalizacion" class="calc-trigger flex-select">
            <option value="ninguno" selected>Ninguna</option>
            <option value="canaleteado">Canaleteado Estético</option>
            <option value="entubado">Entubado de Protección</option>
          </select>
        </div>

        <!-- METRAJE -->
        <div class="item-row" id="rowMetraje">
          <div class="item-info">
            <label>Metros de Canalización</label>
          </div>
          <div class="item-qty">
            <label>Mts:</label>
            <input type="number" id="cantMetros" min="1" value="10" class="calc-trigger text-center">
          </div>
        </div>

        <!-- MANO DE OBRA -->
        <div class="item-row">
          <div class="item-info">
            <label>Detalles u otros:</label>
          </div>
          <div class="item-qty">
            <label>Q</label>
            <input type="number" id="inputManoObra" min="0" placeholder="0.00" value="200" class="calc-trigger custom-price-input text-right">
          </div>
        </div>

        <hr>

        <!-- TOTALES Y DESCUENTO -->
        <div class="totals-section">
          <div class="total-row precio-interno">
            <span>Subtotal:</span>
            <span>Q <span id="lblSubtotal">0.00</span></span>
          </div>

          <div class="total-row discount-input-row precio-interno">
            <label for="inputDescuento">Descuento Especial (%):</label>
            <div class="item-qty">
              <input type="number" id="inputDescuento" min="0" max="100" placeholder="0" value="0" class="calc-trigger text-center">
              <span>%</span>
            </div>
          </div>

          <div class="cuota-box">
            <label>TOTAL DEL SERVICIO: Q</label>
            <span id="lblTotalFinal">0.00</span>
          </div>
        </div>

        <!-- OBSERVACIONES -->
        <div class="comentarios-box">
          <label class="section-label">Observaciones:</label>
          <textarea id="comentarios"></textarea>
        </div>

      </div>

      <div class="ticket-footer text-center">
        <p>📞 5492-6532 / 3243-0074</p>
      </div>

      <div class="actions">
        <button type="button" onclick="window.print()" class="btn-print">Guardar Cotización en PDF / Imprimir</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
